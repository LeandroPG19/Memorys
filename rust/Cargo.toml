[package]
name = "memory-industry"
version = "0.31.0"
edition = "2024"
description = "MemoryIndustry — Knowledge Graph MCP Server — 31 tools, sqlx-migrate, BM25/MMR/OOD search, conformal prediction, testing-effect/Δt-Hebbian/Robbins-Monro cognitive, source credibility, closeness/harmonic/k-core graph, working-memory, audit hash-chain (21 CFR Part 11-oriented) + RLS, MCP Resources URI scheme, MCPSamplingJudge, tree-sitter codegraph, git-native sync hooks, relation provenance"
license = "Apache-2.0"

[[bin]]
name = "memory-industry"
path = "src/main.rs"
test = false

[[bin]]
name = "cuba-memorys"
path = "src/main.rs"
test = false

[dependencies]
half = "2"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
pgvector = { version = "0.4.2", features = ["sqlx"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# default-features off: the default `download-binaries` builds ureq and OpenSSL for ort-sys's build script, which returns at once under `load-dynamic`.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "api-24", "load-dynamic", "half"] }
# Direct only to open ONNX Runtime before `ort` does: rc.12 deadlocks on a
# library it cannot load (see `embeddings::onnx::load_onnxruntime_once`). The
# version `ort` already pulls in, so the lock gains an edge and no crate.
libloading = "0.9.0"
# only `from_file` and `encode`: progressbar and esaxx_fast serve training, and onig is the regex engine the default had.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

anyhow = "1"

async-trait = "0.1"

tiktoken-rs = "0.7"

nalgebra = { version = "0.35", default-features = false, features = ["std"] }

sha2 = "0.11"
hmac = "0.13"
hex = "0.4"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

lru = "0.19"

zstd = "0.14.3"

# reqwest 0.13's `rustls` feature brings aws-lc-rs (C, a second crypto provider next to the ring that sqlx uses); `rustls-no-provider` leaves the provider to
# the program, and `http_client::builder` installs ring once. Certificates are checked by the operating system's verifier (rustls-platform-verifier:
# the system store, which on Linux needs `ca-certificates`), not by a bundle compiled in. Default features off because `default-tls` is the aws-lc-rs one;
# `charset`, `http2` and `system-proxy` stay off, as they were with 0.12.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
# Direct only so that `http_client` can install ring. Default features off: rustls's default is aws-lc-rs, and `cargo tree -i aws-lc-rs` has to stay empty.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }

url = { version = "2", optional = true }
html2text = { version = "0.17", optional = true }


mimalloc = "0.1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"

# Only for the TLS server on loopback of tests/group_no_server/outbound_http_contract.rs, which makes its own certificates so that no key sits in the repository.
# Both are named without their defaults on purpose: rcgen's default is ring today and tokio-rustls's is aws-lc-rs, and `cargo tree -i aws-lc-rs` has to stay empty.
[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[features]
default = ["docs"]
cuda = ["ort/cuda"]
directml = ["ort/directml"]
docs = ["dep:url", "dep:html2text"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `serve` puts every client in one process, so an aborting panic would take down
# every editor window at once. Unwinding lets the HTTP transport contain a panic
# to the single request that caused it.
panic = "unwind"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.dev]
debug = 1

[profile.quick]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
debug = false
strip = true
