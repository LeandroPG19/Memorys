[package]
name = "memory-industry"
version = "0.25.0"
edition = "2024"
description = "MemoryIndustry — Knowledge Graph MCP Server — 31 tools, sqlx-migrate, BM25/MMR/OOD search, conformal prediction, testing-effect/Δt-Hebbian/Robbins-Monro cognitive, source credibility, closeness/harmonic/k-core graph, working-memory, audit hash-chain (21 CFR Part 11-oriented) + RLS, MCP Resources URI scheme, MCPSamplingJudge, tree-sitter codegraph, git-native sync hooks, relation provenance"
license = "Apache-2.0"

[[bin]]
name = "memory-industry"
path = "src/main.rs"

[[bin]]
name = "cuba-memorys"
path = "src/main.rs"

[dependencies]
half = "2"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
pgvector = { version = "0.4", features = ["sqlx"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

ort = { version = "=2.0.0-rc.12", features = ["load-dynamic", "tls-native-vendored", "half"] }
tokenizers = "0.21"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

anyhow = "1"

async-trait = "0.1"

tiktoken-rs = "0.7"

nalgebra = { version = "0.33", default-features = false, features = ["std"] }

sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

lru = "0.12"

zstd = "0.13"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

url = { version = "2", optional = true }
html2text = { version = "0.12", optional = true }


mimalloc = "0.1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"

[features]
default = []
cuda = ["ort/cuda"]
directml = ["ort/directml"]
docs = ["dep:url", "dep:html2text"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `serve` puts every client in one process, so an aborting panic would take down
# every editor window at once. Unwinding lets the HTTP transport contain a panic
# to the single request that caused it.
panic = "unwind"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.dev]
debug = 1

[profile.quick]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
debug = false
strip = true
