# cargo-deny configuration for cuba-memorys
# AI-3: Automated GPL/AGPL/SSPL rejection + advisory checking
#
# Usage: cargo install cargo-deny && cargo deny check
# CI: cargo deny check licenses advisories

[licenses]
# Dependencies stay permissive on purpose. cuba-memorys is Apache-2.0, and a copyleft
# dependency would force the whole binary to that dependency's terms — defeating the
# point of a permissive licence. We can relicense our own code, not someone else's.
#
# Under `version = 2` this allow-list is exhaustive: anything not named here is
# rejected. That is why there is no `deny` list — cargo-deny removed the key
# (PR #611) precisely because it was redundant, and keeping it made the whole file
# fail to validate. GPL, AGPL, LGPL and SSPL are still refused; they are refused by
# not appearing above, which is stricter than enumerating them.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    # webpki-roots / webpki-root-certs: Mozilla's CA bundle, redistributed under the
    # Community Data License Agreement. Permissive, no copyleft, no reciprocity on
    # the binary — it grants rights over the *data*, which is what a CA bundle is.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Scope, not severity: cargo-deny 0.20 replaced the old "warn"/"deny" values here
# with a selector, and the stale "warn" made the whole file fail to deserialize —
# which took down `check licenses bans sources` too, not just the advisories run.
# "workspace" keeps the check on the dependencies this project actually chooses.
unmaintained = "workspace"
# Treat yanked versions as deny
yanked = "deny"
# Ignore specific advisories if needed (add IDs here)
ignore = [
    # RUSTSEC-2023-0071: rsa Marvin Attack via sqlx-mysql.
    # sqlx-mysql is in Cargo.lock but NOT compiled (no mysql feature).
    # Confirmed via `cargo tree -i sqlx-mysql` → "nothing to print".
    # No fix available upstream (sqlx side). False positive for our binary.
    { id = "RUSTSEC-2023-0071", reason = "sqlx-mysql not compiled — no mysql feature enabled, confirmed via cargo tree" },
]

[bans]
# Prevent duplicate versions of the same crate
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
